---
- name: Join all VPS to Tailscale
  hosts: all
  become: true

  vars_prompt:
    - name: tailscale_auth_key
      prompt: "Enter Tailscale Auth Key"
      private: true

  tasks:
    - name: Join Tailscale network
      ansible.builtin.command:
        cmd: "tailscale up --auth-key={{ tailscale_auth_key }}"
      register: tailscale_up
      no_log: true

    - name: Show Tailscale status
      ansible.builtin.command:
        cmd: tailscale status
      register: tailscale_status
      changed_when: false

    - name: Show result
      ansible.builtin.debug:
        var: tailscale_status.stdout_lines